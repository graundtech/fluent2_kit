name: Android example APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build example APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Build APK (runs package + example tests)
        run: scripts/build_android_example.sh --apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluent2_kit-example-apk-${{ github.sha }}
          path: example/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
