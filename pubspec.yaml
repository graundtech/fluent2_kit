name: fluent2ui
description: A robust Fluent2 Material-based design system for seamless and intuitive user experiences.
version: 10.0.0
homepage: https://graund.io
repository: https://github.com/graundtech/fluent2ui
issue_tracker: https://github.com/graundtech/fluent2ui/issues

topics:
  - fluent
  - design-system
  - components
  - theming
  - microsoft

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  fluentui_system_icons: ^1.1.223
  custom_sliding_segmented_control: ^1.7.4

dev_dependencies:
  lints: ^3.0.0
  test: ^1.21.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
